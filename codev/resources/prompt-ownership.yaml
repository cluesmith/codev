# Prompt-ownership map (Spec 1252, M1/M4 — Appendix A).
#
# THE SINGLE-OWNER RULE: every instruction has exactly one owning surface; all
# other surfaces reference or summarize it, never restate it. Scar rules are
# the ratified exception (see codev/resources/scar-rules.yaml — they replicate
# verbatim; their enforcement lives there, NOT here, so ownership of scar
# enforcement itself stays single).
#
# COMPLETENESS CONTRACT (T12, prompt-ownership.test.ts): a mechanical extractor
# collects every normative line (MUST/NEVER/ALWAYS/DO NOT/…) from the
# inventory_boundary below. Every candidate must resolve to a disposition:
# `mapped` (an instruction class below), `scar` (registered in
# scar-rules.yaml), or `out-of-scope` (with justification). No fourth state.
# The final catch-all may absorb only SINGLE-FILE candidates — any normative
# text appearing on 2+ boundary files must have a specific disposition, so new
# cross-surface duplication fails CI the moment it is introduced.
#
# Content OUTSIDE the boundary is out of scope BY DECLARATION, not by
# omission: protocol.md docs, templates, consult-types (on-demand reference,
# correctly tiered — see spec "What is working"), COLD arch.md /
# lessons-learned.md (user-evolved reference), and codev/resources/ generally.
# codev/resources/ is also deliberately excluded from the shadow-drift regime:
# FRAMEWORK_DRIFT_DIRS omits it because those are user-evolved files where
# divergence from any template is legitimate (Q7 — recording the WHY is
# required M1 coverage).

inventory_boundary:
  # Always-on
  - CLAUDE.md
  - codev/resources/arch-critical.md
  - codev/resources/lessons-critical.md
  # Spawn-delivered
  - codev-skeleton/roles/architect.md
  - codev-skeleton/roles/builder.md
  - codev-skeleton/roles/consultant.md
  - codev-skeleton/protocols/air/builder-prompt.md
  - codev-skeleton/protocols/aspir/builder-prompt.md
  - codev-skeleton/protocols/bugfix/builder-prompt.md
  - codev-skeleton/protocols/experiment/builder-prompt.md
  - codev-skeleton/protocols/maintain/builder-prompt.md
  - codev-skeleton/protocols/pir/builder-prompt.md
  - codev-skeleton/protocols/research/builder-prompt.md
  - codev-skeleton/protocols/spike/builder-prompt.md
  - codev-skeleton/protocols/spir/builder-prompt.md
  # Per-phase (porch-injected)
  - codev-skeleton/porch/prompts/defend.md
  - codev-skeleton/porch/prompts/diagnose.md
  - codev-skeleton/porch/prompts/evaluate.md
  - codev-skeleton/porch/prompts/fix.md
  - codev-skeleton/porch/prompts/implement.md
  - codev-skeleton/porch/prompts/plan.md
  - codev-skeleton/porch/prompts/pr.md
  - codev-skeleton/porch/prompts/review.md
  - codev-skeleton/porch/prompts/specify.md
  - codev-skeleton/porch/prompts/test.md
  # NOTE: AGENTS.md is byte-identical to CLAUDE.md (enforced by T6); scanning
  # both would double-count every candidate.

surfaces:
  - { id: claude-md, path: CLAUDE.md, load: always-on }
  - { id: agents-md, path: AGENTS.md, load: always-on }
  - { id: arch-critical, path: codev/resources/arch-critical.md, load: always-on }
  - { id: lessons-critical, path: codev/resources/lessons-critical.md, load: always-on }
  - { id: role-architect, path: codev-skeleton/roles/architect.md, load: spawn }
  - { id: role-builder, path: codev-skeleton/roles/builder.md, load: spawn }
  - { id: role-consultant, path: codev-skeleton/roles/consultant.md, load: spawn }
  - { id: bp-air, path: codev-skeleton/protocols/air/builder-prompt.md, load: spawn }
  - { id: bp-aspir, path: codev-skeleton/protocols/aspir/builder-prompt.md, load: spawn }
  - { id: bp-bugfix, path: codev-skeleton/protocols/bugfix/builder-prompt.md, load: spawn }
  - { id: bp-experiment, path: codev-skeleton/protocols/experiment/builder-prompt.md, load: spawn }
  - { id: bp-maintain, path: codev-skeleton/protocols/maintain/builder-prompt.md, load: spawn }
  - { id: bp-pir, path: codev-skeleton/protocols/pir/builder-prompt.md, load: spawn }
  - { id: bp-research, path: codev-skeleton/protocols/research/builder-prompt.md, load: spawn }
  - { id: bp-spike, path: codev-skeleton/protocols/spike/builder-prompt.md, load: spawn }
  - { id: bp-spir, path: codev-skeleton/protocols/spir/builder-prompt.md, load: spawn }
  - { id: pp-defend, path: codev-skeleton/porch/prompts/defend.md, load: phase-prompt }
  - { id: pp-diagnose, path: codev-skeleton/porch/prompts/diagnose.md, load: phase-prompt }
  - { id: pp-evaluate, path: codev-skeleton/porch/prompts/evaluate.md, load: phase-prompt }
  - { id: pp-fix, path: codev-skeleton/porch/prompts/fix.md, load: phase-prompt }
  - { id: pp-implement, path: codev-skeleton/porch/prompts/implement.md, load: phase-prompt }
  - { id: pp-plan, path: codev-skeleton/porch/prompts/plan.md, load: phase-prompt }
  - { id: pp-pr, path: codev-skeleton/porch/prompts/pr.md, load: phase-prompt }
  - { id: pp-review, path: codev-skeleton/porch/prompts/review.md, load: phase-prompt }
  - { id: pp-specify, path: codev-skeleton/porch/prompts/specify.md, load: phase-prompt }
  - { id: pp-test, path: codev-skeleton/porch/prompts/test.md, load: phase-prompt }
  # Ownership anchors outside the scan boundary (on-demand reference docs)
  - { id: spir-protocol-doc, path: codev-skeleton/protocols/spir/protocol.md, load: on-demand }
  - { id: agent-farm-doc, path: codev/resources/commands/agent-farm.md, load: on-demand }
  # Shared partials — single authored owner, expanded into every served prompt
  # at assembly time via {{> partials/...}} (resolveCodevIncludes)
  - { id: partial-soft-mode, path: codev-skeleton/partials/soft-mode-compliance.md, load: spawn }
  - { id: partial-notifications, path: codev-skeleton/partials/builder-notifications.md, load: spawn }
  - { id: partial-multi-pr, path: codev-skeleton/partials/multi-pr-mechanics.md, load: spawn }
  - { id: partial-strict-restrictions, path: codev-skeleton/partials/strict-mode-restrictions.md, load: spawn }
  - { id: partial-no-time-estimates, path: codev-skeleton/partials/no-time-estimates.md, load: phase-prompt }
  - { id: partial-flaky, path: codev-skeleton/partials/flaky-test-handling.md, load: spawn }
  - { id: partial-fidelity, path: codev-skeleton/partials/porch-workflow-fidelity.md, load: spawn }
  - { id: partial-3way, path: codev-skeleton/partials/no-skip-3way-review.md, load: spawn }
  - { id: partial-baked, path: codev-skeleton/partials/baked-decisions.md, load: spawn }
  - { id: partial-pr-strategy, path: codev-skeleton/partials/pr-strategy.md, load: spawn }

# Non-scar instruction classes with cross-surface duplication, discovered by
# the extractor at Phase 6. All are `enforcement: manual` until Phase 7
# replaces the non-owner restatements with references — flipping each to
# `automated` is part of that phase's deliverable (mirrors the drift gate's
# staged-activation pattern).
instructions:
  - id: no-skip-porch-checks
    summary: Never skip or work around porch checks to avoid a failure.
    owner: partial-flaky
    scar: false
    pattern: "skip porch checks or use any workaround"
    enforcement: automated
    retained_restatements: [bp-air, bp-maintain, bp-pir, bp-spike, pp-implement]
    manual_justification: >
      Extracted for the uniform four (spir/aspir/bugfix/experiment). air,
      maintain, pir, spike keep protocol-specific flaky-handling variants by
      decision (e.g. AIR documents skips in the PR body, not a review file).

  - id: no-skip-3way-review
    summary: Never skip the 3-way review; follow the porch next/done cycle.
    owner: partial-3way
    scar: false
    pattern: "NEVER skip the 3-way review"
    enforcement: automated
    references: []

  - id: no-advance-phases-manually
    summary: Porch advances plan phases; never advance them manually.
    owner: partial-strict-restrictions
    scar: false
    pattern: "NEVER advance plan phases manually"
    enforcement: automated
    references: []

  - id: baked-decisions-handling
    summary: Treat issue-body Baked Decisions as fixed; escalate conflicts, never override.
    owner: partial-baked
    scar: false
    pattern: "Baked Decisions"
    enforcement: automated
    retained_restatements: [bp-air, pp-specify, pp-implement, partial-pr-strategy, bp-spir, bp-aspir, spir-protocol-doc]
    manual_justification: >
      Extracted for spir/aspir. bp-air keeps its protocol-specific wording
      (Spec 746 wrote per-protocol clauses); the drafting prompts carry their
      own 0.5-section variants; the pattern phrase also appears incidentally
      in pr-strategy and the include lines. Retentions by decision, revisit
      in MAINTAIN.

  - id: pr-single-by-default
    summary: Builders do not autonomously open per-phase PRs; one PR by default.
    owner: partial-pr-strategy
    scar: false
    pattern: "Do not autonomously open a PR per implementation phase"
    enforcement: automated
    references: []

  - id: porch-workflow-fidelity
    summary: Strict-mode builders follow the porch-driven workflow without deviation.
    owner: partial-fidelity
    scar: false
    pattern: "Do not deviate from the porch-driven workflow"
    enforcement: automated
    references: []

  - id: multi-pr-mechanics
    summary: Sequential-PR mechanics (branch off origin, never checkout the integration branch).
    owner: partial-multi-pr
    scar: false
    pattern: "git checkout <integration-branch>"
    enforcement: automated
    references: []

  - id: notify-architect-key-moments
    summary: Builders notify the architect via afx send at key moments.
    owner: partial-notifications
    scar: false
    pattern: "notify the architect at key moments"
    enforcement: automated
    retained_restatements: [bp-air, bp-bugfix]
    manual_justification: >
      AUTOMATED for the extracted spir/aspir pair. bp-air and bp-bugfix carry
      protocol-specific notification templates (issue-number based, no gates)
      by decision; revisit in MAINTAIN.

  - id: soft-mode-protocol-compliance
    summary: Soft-mode builders have execution flexibility but must stay protocol-compliant.
    owner: partial-soft-mode
    scar: false
    pattern: "must stay compliant with the protocol"
    enforcement: automated
    references: []

  - id: no-time-estimates
    summary: Plans and specs carry no time estimates; AI development makes them meaningless.
    owner: partial-no-time-estimates
    scar: false
    pattern: "estimate time"
    enforcement: automated
    retained_restatements: [spir-protocol-doc]
    manual_justification: >
      spir-protocol-doc (on-demand) retains its own No-Time-Estimates
      section as protocol reference prose by decision.

# Disposition table — first match wins; the catch-all is last and may only
# absorb single-file candidates (enforced by T12).
dispositions:
  # --- scar rules (enforced externally by scar-rules.yaml + T6) ---
  - { match: "git add -A", disposition: scar }
  - { match: "hand-edit `status.yaml`", disposition: scar }
  - { match: "porch gate as approved", disposition: scar }
  - { match: "destroy builder worktrees", disposition: scar }
  - { match: "git reset --hard", disposition: scar }
  - { match: "only from the main workspace root", disposition: scar }
  - { match: "shellper process", disposition: scar }
  - { match: "restart or stop Tower", disposition: scar }

  # --- mapped non-scar duplicated classes ---
  - { match: "skip porch checks or use any workaround", disposition: mapped, class: no-skip-porch-checks }
  - { match: "NEVER skip the 3-way review", disposition: mapped, class: no-skip-3way-review }
  - { match: "NEVER advance plan phases manually", disposition: mapped, class: no-advance-phases-manually }
  - { match: "Baked Decisions", disposition: mapped, class: baked-decisions-handling }
  - { match: "baked-decisions section contains internal contradictions", disposition: mapped, class: baked-decisions-handling }
  - { match: "git checkout <integration-branch>", disposition: mapped, class: multi-pr-mechanics }
  - { match: "notify the architect at key moments", disposition: mapped, class: notify-architect-key-moments }
  - { match: "must stay compliant with the protocol", disposition: mapped, class: soft-mode-protocol-compliance }
  - { match: "Do not autonomously open a PR per implementation phase", disposition: mapped, class: pr-single-by-default }
  - { match: "Do not deviate from the porch-driven workflow", disposition: mapped, class: porch-workflow-fidelity }
  - { match: "/[Dd]on't estimate time|[Nn]o time estimates|NEVER include time estimates/", disposition: mapped, class: no-time-estimates }

  # --- known multi-file texts that are NOT instruction classes ---
  - match: "DO NOT start implementation"
    disposition: out-of-scope
    note: >
      Phase-boundary guard in specify/plan porch prompts — each phase prompt
      legitimately owns its own "you are in phase X, don't do phase Y" line;
      the duplication is structural to the phase machinery, not a rule restated.
  - match: "DO NOT start phase_2"
    disposition: out-of-scope
    note: Porch runtime banner text, phase-machinery structural.

  # --- catch-all: single-file process instructions only ---
  - match: "/.*/"
    disposition: out-of-scope
    catch_all: true
    note: >
      Single-occurrence, file-local process instruction — owned implicitly by
      its file. T12 forbids this entry from absorbing any text that appears on
      2+ files, so new cross-surface duplication cannot hide here.
