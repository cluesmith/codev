name: Dashboard E2E Tests

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 8:00 UTC
  workflow_dispatch:       # Allow manual trigger

jobs:
  playwright:
    name: Dashboard Tests
    # #1935: pinned, not ubuntu-latest. The floating label rolled to ubuntu-26.04, and the
    # Playwright this repo resolves (1.59.x) ships no Chromium build for it (support landed in
    # 1.61). Move this pin only together with a Playwright bump, verified on the new image.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build sdk package
        working-directory: packages/sdk
        run: pnpm build

      - name: Build core package
        working-directory: packages/core
        run: pnpm build

      - name: Build package
        working-directory: packages/codev
        run: pnpm build

      - name: Install Playwright browsers
        id: install-browsers
        working-directory: packages/codev
        run: pnpm exec playwright install chromium

      - name: Run Playwright tests
        working-directory: packages/codev
        env:
          TOWER_ARCHITECT_CMD: bash
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # #1630: the held-popover e2e test (PR #1604) refuses to run without an
          # explicit port so it can never target a live Tower on 4100.
          TOWER_TEST_PORT: '14100'
        run: pnpm exec playwright test --retries 3

      # Spec 1819: the Decisions tab suite writes files, so it runs through its own config —
      # no global setup activating the repository workspace — on a Tower that shares nothing
      # with the one above: its own port, state dir and shellper socket dir.
      # It runs even when the suite above fails, but not when there is no browser to launch
      # (#1935): a failed install is reported once, at its own step, not as launch errors.
      - name: Run Decisions tab tests
        if: ${{ !cancelled() && steps.install-browsers.outcome == 'success' }}
        working-directory: packages/codev
        env:
          TOWER_TEST_PORT: '14101'
          CODEV_AGENT_FARM_DIR: ${{ runner.temp }}/decisions-agent-farm
          SHELLPER_SOCKET_DIR: ${{ runner.temp }}/decisions-shellper
        run: pnpm exec playwright test --config playwright.decisions.config.ts --retries 3

      # Spec 1967: the Peers panel suite and the held-count suite (#1313/#1450) run only through
      # their own config, on a fresh Tower that shares nothing with those above: its own port, and
      # a state, socket and home directory the config makes under the temp directory and removes.
      - name: Run Peers panel and held-count tests
        if: ${{ !cancelled() && steps.install-browsers.outcome == 'success' }}
        working-directory: packages/codev
        env:
          TOWER_TEST_PORT: '14102'
        run: pnpm exec playwright test --config playwright.peers.config.ts --retries 3
