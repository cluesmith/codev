<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- sdpi-components binds <sdpi-select setting="slot"> to this key's persisted
         settings over the property-inspector protocol. -->
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
  </head>
  <body>
    <sdpi-item label="Slot">
      <sdpi-select setting="slot" default="1">
        <option value="1">Slot 1</option>
        <option value="2">Slot 2</option>
        <option value="3">Slot 3</option>
        <option value="4">Slot 4</option>
        <option value="5">Slot 5</option>
        <option value="6">Slot 6</option>
        <option value="7">Slot 7</option>
        <option value="8">Slot 8</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="Verb">
      <sdpi-select setting="verb" default="view-diff">
        <option value="view-diff">View Diff</option>
        <option value="open-terminal">Open Terminal</option>
        <option value="open-spec">Open Spec</option>
        <option value="open-plan">Open Plan</option>
        <option value="open-review">Open Review</option>
        <option value="run-dev">Run Dev</option>
      </sdpi-select>
    </sdpi-item>
    <sdpi-item label="">
      <small>Pins this key to the Nth builder (slot 1 = first builder) and runs
      the chosen verb for it on press.</small>
    </sdpi-item>
  </body>
</html>
